[project]
name = "ratings-project"
version = "0.1.0"
description = "CSV → отчёты по товарам (плагинная архитектура отчётов)"
requires-python = ">=3.9"
dependencies = [
    "tabulate>=0.9.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
[project.optional-dependencies]
dev = ["pytest>=8"]
